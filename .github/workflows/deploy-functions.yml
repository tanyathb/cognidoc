name: Deploy Azure Functions Ingestion Engine

on:
  push:
    branches:
      - main
    paths:
      - 'backend/CogniDoc.Functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'func-cognidoc-ingestion-dev'
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'backend/CogniDoc.Functions'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}/CogniDoc.Functions.csproj"

      - name: Build project
        run: |
          dotnet build "${{ env.PROJECT_PATH }}/CogniDoc.Functions.csproj" \
            --configuration Release \
            --no-restore

      - name: Publish package
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}/CogniDoc.Functions.csproj" \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}